<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Remly</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,500&amp;display=swap"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Remly" />
    <meta name="theme-color" content="#f5f3ee" />
    <meta
      name="description"
      content="Remember when you last saw the people you care about, plan the next time and never miss a birthday."
    />
  </head>
  <body>
    <!-- Shown while the session is restored; Angular replaces it once the app has started. -->
    <app-root>
      <div
        role="status"
        aria-label="Loading Remly"
        style="display: grid; place-items: center; min-height: 100vh; background: #f5f3ee"
      >
        <img src="icons/favicon.svg" alt="" width="48" height="48" />
      </div>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
